apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: ad-historical-nomination-agent
  version: "1.0.0"

provides:
  apis:
    - name: ad-historical-nomination-agent
      kind: a2a
      ordId: customer.build:apiResource:nomination-eta-agent-9bb0c.ad-historical-nomination-agent:v1
      description: "Analyses historical nomination records in OGS/650 to extract voyage patterns, average lead times, and seasonal trends for a given material, route, and transport system."

container:
  buildPath: .
  port: 5000
  env:
    - name: OGS_DESTINATION
      value: "OGS_S4"

requires:
  - name: sap-sf-scm-nomination-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:nomination-eta-agent-9bb0c.sap-sf-scm-nomination-mcp-server:v1
  - name: sap-s4-oil-transport-system-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:nomination-eta-agent-9bb0c.sap-s4-oil-transport-system-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
