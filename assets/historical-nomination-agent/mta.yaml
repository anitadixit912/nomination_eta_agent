_schema-version: "3.1"
ID: historical-nomination-agent-new
version: 1.0.0
description: "Historical Nomination Agent - analyses historical voyage patterns"

modules:
  - name: historical-nomination-agent-new
    type: python
    path: .
    parameters:
      buildpack: python_buildpack
      memory: 1024M
      disk-quota: 2048M
      instances: 1
      command: python app/main.py
    properties:
      AGENT_PUBLIC_URL: https://historical-nomination-agent-new.cfapps.us10.hana.ondemand.com
    provides:
      - name: historical-agent
        properties:
          agent-url: ${default-url}
