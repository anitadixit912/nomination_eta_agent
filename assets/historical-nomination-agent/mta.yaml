_schema-version: "3.1"
ID: historical-nomination-agent-new
version: 1.0.0
description: "Historical Nomination Agent - analyses historical voyage patterns"

modules:
  - name: historical-nomination-agent-new
    type: python
    path: .
    parameters:
      buildpack: python_buildpack
      memory: 512M
      disk-quota: 1024M
      instances: 1
      command: python app/main.py --port $PORT

    provides:
      - name: historical-agent
        properties:
          agent-url: ${default-url}
