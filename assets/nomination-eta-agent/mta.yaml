    type: python
    path: .
    parameters:
      buildpack: python_buildpack
      memory: 512M
      disk-quota: 1024M
      instances: 1
      command: python app/main.py --port $PORT
    properties:
      HISTORICAL_AGENT_URL: https://historical-nomination-agent-new.cfapps.us10.hana.ondemand.com
      AIS_AGENT_URL: https://ais-vessel-tracking-agent-new.cfapps.us10.hana.ondemand.com
      GEO_WEATHER_AGENT_URL: https://geo-weather-agent-new.cfapps.us10.hana.ondemand.com
      CAP_SERVICE_URL: https://gdh-prj-vector-hackathon-apac-dev10-4dixnr9o-dev-nomina74ce89c1.cfapps.us10.hana.ondemand.com
    provides:
      - name: nomination-eta-agent
        properties:
          agent-url: ${default-url}
