_schema-version: "3.1"
ID: geo-weather-agent-new
version: 1.0.0
description: "Geo Weather Agent - assesses geopolitical and weather risks for routes"

modules:
  - name: geo-weather-agent-new
    type: python
    path: .
    parameters:
      buildpack: python_buildpack
      memory: 256M
      disk-quota: 512M
      instances: 1
      command: python app/main.py
    properties:
      AGENT_PUBLIC_URL: https://geo-weather-agent-new.cfapps.us10.hana.ondemand.com
    provides:
      - name: geo-weather-agent
        properties:
          agent-url: ${default-url}
