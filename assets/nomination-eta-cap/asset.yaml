apiVersion: asset.sap/v1
kind: Asset
type: cap-app

metadata:
  name: nomination-eta-cap
  version: "1.0.0"
  description: "CAP Node.js backend with React UI. Handles nomination ETA approval queue, polls S/4HANA OGS/650 directly for open nominations every 30 minutes, and exposes REST + OData APIs."

provides:
  protocols:
    - odata-v4
    - rest

requires:
  - name: destination
    kind: platform-service
    service: destination
    plan: lite
  - name: connectivity
    kind: platform-service
    service: connectivity
    plan: lite
  - name: xsuaa
    kind: platform-service
    service: xsuaa
    plan: application
    parameters:
      xsappname: nomination-eta-cap
      tenant-mode: dedicated

custom:
  cap:
    env:
      OGS_DESTINATION: "OGS_S4"
  notes: |
    S/4HANA integration is handled directly via BTP Destination Service (OGS_S4).
    Nominations are fetched on page load and every 30 minutes automatically.
    n8n workflows are not required for this integration path.
