_schema-version: "3.1"
ID: nomination-eta-new-cap
version: 1.0.0
description: "Nomination ETA Agent - CAP backend + React UI"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npm run build --workspace=app/react-ui
        - npx cds build --production
        - node -e "const fs=require('fs');const path=require('path');const src='app/react-ui/dist';const dst='gen/srv/app';fs.mkdirSync(dst,{recursive:true});fs.cpSync(src,dst,{recursive:true});console.log('UI copied to gen/srv/app');"

modules:

  - name: nomination-eta-new-cap-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm
      ignore:
        - .env
        - node_modules/
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: nomination-eta-new-xsuaa
      - name: nomination-eta-new-destination
      - name: nomination-eta-new-connectivity

  - name: nomination-eta-new-cap-ui
    type: html5
    path: app/react-ui/dist
    build-parameters:
      builder: custom
      commands: []
      supported-platforms: []
    requires:
      - name: nomination-eta-new-xsuaa

resources:

  - name: nomination-eta-new-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: nomination-eta-new-cap-${org}-${space}
        tenant-mode: dedicated

  - name: nomination-eta-new-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: nomination-eta-new-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
