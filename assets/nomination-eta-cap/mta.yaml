_schema-version: "3.1"
ID: nomination-eta-new-cap
version: 1.0.0
description: "Nomination ETA Agent - CAP backend + React UI"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npm run build --workspace=app/react-ui
        - npx cds build --production
        - npx cds deploy --to sqlite:gen/srv/db.sqlite

modules:

  - name: nomination-eta-new-cap-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: custom
      commands:
        - npm install --production
        - node -e "const fs=require('fs');const src='../../app/react-ui/dist';const dst='app';if(fs.existsSync(src)){fs.mkdirSync(dst,{recursive:true});fs.cpSync(src,dst,{recursive:true});console.log('UI copied to app/');}else{console.error('Source not found:',src);}"

    properties:
      NOMINATION_ETA_AGENT_URL: ~{nomination-eta-agent/agent-url}
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: nomination-eta-new-xsuaa
      - name: nomination-eta-new-destination
      - name: nomination-eta-new-connectivity
      - name: nomination-eta-agent

resources:

  - name: nomination-eta-new-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: nomination-eta-new-cap-${org}-${space}
        tenant-mode: dedicated

  - name: nomination-eta-new-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: nomination-eta-new-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
