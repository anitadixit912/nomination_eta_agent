apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: ais-vessel-tracking-agent
  version: "1.0.0"

provides:
  apis:
    - name: ais-vessel-tracking-agent
      kind: a2a
      ordId: customer.build:apiResource:nomination-eta-agent-9bb0c.ais-vessel-tracking-agent:v1
      description: "Fetches live AIS vessel position, speed, and heading from AISStream.io and computes predicted ETA to the nomination destination port."

container:
  buildPath: .
  port: 5000
  env:
    - name: AISSTREAM_API_KEY
      value: ""

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
