_schema-version: "3.1"
ID: ais-vessel-tracking-agent-new
version: 1.0.0
description: "AIS Vessel Tracking Agent - tracks live vessel positions"

modules:
  - name: ais-vessel-tracking-agent-new
    type: python
    path: .
    parameters:
      buildpack: python_buildpack
      memory: 512M
      disk-quota: 1024M
      instances: 1
      command: python app/main.py
    properties:
      PORT: "8080"
    provides:
      - name: ais-agent
        properties:
          agent-url: ${default-url}
